<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#18213E">
<title>Dove si trova il bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Grafica Busitalia 05_2026: fasce Blu scuro, corpo Talco, Urbanist, niente angoli arrotondati né ombre.
   Testo secondario #5E5E5D invece del Grigio freddo: la pagina è pubblica e deve restare leggibile (WCAG AA). */
:root { --bg:#F2F2F2; --surface:#FFFFFF; --band:#18213E; --ink:#3C3C3B; --ink2:#5E5E5D;
  --accent:#00665B; --alert:#DD052B; --font:'Urbanist', system-ui, sans-serif; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); display:flex; flex-direction:column; }
header { background:var(--band); color:#fff; padding:12px 16px calc(12px) 16px; padding-top:max(12px, env(safe-area-inset-top));
  display:flex; align-items:center; gap:14px; }
header img { height:30px; width:auto; display:block; }
header .titoli { min-width:0; }
header .occhiello { font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; opacity:.85; font-weight:600; }
header h1 { margin:0; font-size:1.35rem; font-weight:900; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#mappa { flex:1; min-height:240px; background:#dfe3e6; }
#scheda { background:var(--surface); border-top:4px solid var(--accent); padding:14px 16px;
  padding-bottom:max(14px, env(safe-area-inset-bottom)); }
#scheda.ferma { border-top-color:var(--alert); }
#scheda.vuota { border-top-color:var(--ink2); }
.stato { font-size:1.15rem; font-weight:900; margin:0; }
.dettaglio { margin:2px 0 0; color:var(--ink2); }
.avviso { margin:4px 0 0; color:var(--alert); font-weight:600; }
.avviso:empty { display:none; }
.riga { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.riga + .riga { border-top:1px solid #D9D9D9; margin-top:10px; padding-top:10px; }
.riga.ferma .stato { color:var(--alert); }
.dir { display:flex; align-items:center; gap:8px; font-size:.95rem; font-weight:900; margin:0; }
.dir i { width:12px; height:12px; display:inline-block; flex:none; }
.multi .stato { font-size:1.05rem; }
button { font:600 1rem var(--font); background:var(--accent); color:#fff; border:0; padding:10px 14px; cursor:pointer; }
button:focus-visible { outline:3px solid var(--band); outline-offset:2px; }
footer { background:var(--band) url('../img/piede-scia.jpg') right center / auto 100% no-repeat; color:#fff;
  font-size:.75rem; padding:6px 16px; }
#vuoto { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
  background:var(--bg); z-index:1000; text-align:center; }
#vuoto div { max-width:420px; }
#vuoto h2 { margin:0 0 8px; font-size:1.4rem; font-weight:900; }
main { position:relative; flex:1; display:flex; flex-direction:column; }
.bus-icona { background:none; border:0; }
.leaflet-container { font-family:var(--font); }
.etichetta { font:600 .85rem var(--font); color:var(--band); background:#fff; border:1px solid var(--band); border-radius:0; box-shadow:none; padding:1px 6px; }
.etichetta::before { display:none; }
.eta { margin:6px 0 0; font-weight:900; font-size:1.05rem; color:var(--band); background:#EEF3F2; border-left:4px solid var(--accent); padding:3px 8px; }
.eta:empty { display:none; }
.eta small { display:block; font-weight:600; color:var(--ink2); }
#arrivo { background:var(--surface); border-top:1px solid #D9D9D9; padding:8px 16px; }
#arrivo label { display:block; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--ink2); }
#arrivo .r { display:flex; gap:8px; margin-top:4px; }
#arrivo select { flex:1; min-width:0; font:600 1rem var(--font); color:var(--ink); padding:8px; border:1px solid #9a9a9a; border-radius:0; background:#fff; }
#arrivo button { background:#fff; color:var(--accent); border:2px solid var(--accent); padding:8px 10px; white-space:nowrap; }
#arrivo p { margin:4px 0 0; font-size:.85rem; color:var(--ink2); }
#arrivo p:empty { display:none; }
.tutto-percorso { font:600 .85rem var(--font); background:#fff; color:var(--band); border:2px solid rgba(0,0,0,.2); padding:6px 10px; }
.tutto-percorso:hover { background:#f4f4f4; }
</style>
</head>
<body>
<header>
  <img src="../img/logo-bianco.png" alt="FS Busitalia">
  <div class="titoli">
    <div class="occhiello">Dove si trova il bus</div>
    <h1 id="servizio">…</h1>
  </div>
</header>
<main>
  <div id="mappa" role="region" aria-label="Mappa con la posizione del bus"></div>
  <div id="vuoto" role="status"><div><h2 id="vuoto-titolo">Un momento…</h2><p id="vuoto-testo">Sto cercando il bus.</p></div></div>
</main>
<section id="arrivo" hidden>
  <label for="sel-fermata">Quanto manca alla tua fermata?</label>
  <div class="r"><select id="sel-fermata"><option value="">Scegli la fermata…</option></select><button type="button" id="vicina">Vicina a me</button></div>
  <p id="esito-vicina" aria-live="polite"></p>
</section>
<section id="scheda" aria-live="polite">
  <div class="riga"><div><p class="stato">Cerco il bus…</p><p class="dettaglio">&nbsp;</p></div></div>
</section>
<footer>Busitalia · posizione aggiornata ogni 5 secondi</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// Il QR stampato porta il codice d'accesso della linea dopo il «#» (#t=...): il «#» non viene mai mandato a GitHub.
// Il codice apre in sola lettura l'utente Traccar della linea, che vede solo il telefono abbinato in quel momento
// dalla pagina /abbina/. Qui non ci sono credenziali.
const SERVER = 'https://traccar.fsbusitalia.com';
const OGNI = 5000;                 // ms fra un aggiornamento e l'altro
const VECCHIA = 10 * 60 * 1000;    // oltre 10 minuti la posizione si dichiara non aggiornata
const parametri = new URLSearchParams(location.hash.slice(1));
const CODICE = parametri.get('t') || '';
const $ = id => document.getElementById(id);

const mappa = L.map('mappa', { zoomControl: true, attributionControl: true }).setView([45.9, 10.2], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(mappa);
// Un colore per direzione, come nella pagina di abbinamento (Verde e Blu della palette FS)
const COLORI = ['#00665B', '#004587', '#B91372', '#1B9AAA'];
const icona = c => L.divIcon({ className: 'bus-icona', iconSize: [46, 46], iconAnchor: [23, 23], html:
  `<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="${c}" stroke="#fff" stroke-width="3"/>` +
  '<g fill="#fff"><rect x="13" y="12" width="20" height="19"/><rect x="15" y="31" width="4" height="4"/><rect x="27" y="31" width="4" height="4"/></g>' +
  `<g fill="${c}"><rect x="15" y="14" width="16" height="8"/><circle cx="17" cy="27" r="1.6"/><circle cx="29" cy="27" r="1.6"/></g></svg>` });

// Una linea puo' avere un bus per direzione: l'utente del QR vede un telefono per direzione, e l'attributo
// «direzioni» (testo JSON, scritto dalla pagina di abbinamento) dice quale direzione fa ciascun telefono.
let direzioni = [];                       // [{nome, deviceId}]
const bus = new Map();                    // deviceId -> {segnaposto, alone, posizione, nome, colore}
let seguire = 'tutti', primo = true, firma = '';
mappa.on('dragstart', () => { seguire = null; });

function vuoto(titolo, testo) {
  $('vuoto-titolo').textContent = titolo; $('vuoto-testo').textContent = testo;
  $('vuoto').style.display = 'flex'; $('arrivo').hidden = true;
  for (const b of bus.values()) { b.segnaposto.remove(); b.alone.remove(); }
  bus.clear(); firma = ''; primo = true; seguire = 'tutti';
  $('scheda').className = 'vuota';
  $('scheda').innerHTML = '<div class="riga"><div><p class="stato"></p><p class="dettaglio"></p></div></div>';
  $('scheda').querySelector('.stato').textContent = titolo; $('scheda').querySelector('.dettaglio').textContent = testo;
}
function ora(d) { return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function quanto(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s <= 1 ? 'adesso' : s + ' secondi fa';
  const m = Math.round(s / 60); if (m < 60) return m === 1 ? '1 minuto fa' : m + ' minuti fa';
  const h = Math.floor(m / 60); return h === 1 ? 'più di un\'ora fa' : 'più di ' + h + ' ore fa';
}
async function api(percorso) {
  const r = await fetch(SERVER + percorso, { headers: { Authorization: 'Bearer ' + CODICE, Accept: 'application/json' }, cache: 'no-store' });
  if (r.status === 401 || r.status === 403) throw new Error('codice');
  if (!r.ok) throw new Error('rete');
  return r.json();
}
async function leggiServizio() {
  // /api/session?token= restituisce l'utente della linea: nome del servizio e direzioni stanno nei suoi attributi
  try {
    const r = await fetch(SERVER + '/api/session?token=' + encodeURIComponent(CODICE), { cache: 'no-store' });
    if (!r.ok) return;
    const u = await r.json(), at = u.attributes || {};
    const nome = at.servizio || u.name || '';
    $('servizio').textContent = nome; document.title = 'Dove si trova il bus · ' + nome;
    try { const v = JSON.parse(at.direzioni || '[]'); direzioni = Array.isArray(v) ? v : []; } catch (e) { direzioni = []; }
    linea = (u.email || '').replace(/^qr-/i, '').toLowerCase();
    leggiPercorso();
    await leggiPunti();
  } catch (e) { /* il nome resta quello di prima */ }
}

// Percorso e fermate della linea dal GTFS: ../percorsi/<codice>.json, scritto da qr_posizione/gtfs_percorsi.py.
// Si disegnano sotto i punti notevoli e sotto i bus; il file si legge una volta sola per linea.
mappa.createPane('percorso').style.zIndex = 350;      // sotto le geo aree (400) e i bus (600)
const stratoPercorso = L.featureGroup().addTo(mappa);
let percorsoDi = '', fermate = [], segni = [];
async function leggiPercorso() {
  if (!linea || percorsoDi === linea) return;
  percorsoDi = linea;
  try {
    const r = await fetch('../percorsi/' + encodeURIComponent(linea) + '.json');
    if (!r.ok) return;
    const p = await r.json();
    stratoPercorso.clearLayers();
    for (const d of p.direzioni || []) {
      L.polyline(d.punti, { pane: 'percorso', color: '#fff', weight: 8, opacity: .9, interactive: false }).addTo(stratoPercorso);
      L.polyline(d.punti, { pane: 'percorso', color: '#18213E', weight: 4, opacity: .65, interactive: false }).addTo(stratoPercorso);
    }
    fermate = p.fermate || [];
    segni = fermate.map((f, i) =>
      L.circleMarker([f.lat, f.lon], { pane: 'percorso', radius: 6, color: '#18213E', weight: 3, fillColor: '#fff', fillOpacity: 1 })
        .bindTooltip('Fermata · ' + f.nome, { direction: 'top', offset: [0, -6], className: 'etichetta' })
        .on('click', () => scegli(i, true)).addTo(stratoPercorso));
    bottonePercorso.addTo(mappa);
    preparaArrivi(p);
  } catch (e) { percorsoDi = ''; /* il percorso è un di più: senza, la mappa funziona lo stesso */ }
}
const bottonePercorso = L.control({ position: 'topleft' });
bottonePercorso.onAdd = () => {
  const b = L.DomUtil.create('button', 'tutto-percorso'); b.type = 'button'; b.textContent = 'Tutto il percorso';
  L.DomEvent.disableClickPropagation(b);
  b.onclick = () => { if (stratoPercorso.getLayers().length) { seguire = null; mappa.fitBounds(stratoPercorso.getBounds(), { padding: [24, 24] }); } };
  return b;
};

// ---------- Quanto manca alla tua fermata (24/11/2026) ----------
// Dal GTFS ogni direzione ha le sue fermate (metri lungo il percorso) e le sue corse (orari). La corsa che il bus sta
// facendo è quella in cui, secondo l'orario, il bus dovrebbe essere adesso più vicino a dove si trova davvero; la
// differenza è il ritardo. I minuti alla fermata scelta sono il tempo d'orario che manca dal punto in cui è il bus.
// La fermata la sceglie il passeggero (elenco o tocco sulla mappa); «Vicina a me» usa la posizione del telefono solo
// se il passeggero la concede, e solo nel suo browser: non va a nessun server.
let orario = null, scelta = -1;
const tracce = new Map();                 // deviceId -> [{t, m:[metri su ogni direzione]}]: in che verso va il bus
function preparaArrivi(p) {
  if (!(p.direzioni || []).some(d => (d.corse || []).length)) return;      // GTFS senza orari: niente stima
  orario = p; orario.giorni = (p.calendari || []).map(c => new Set(c));
  for (const d of p.direzioni) {
    d.cum = [0];
    for (let i = 1; i < d.punti.length; i++) d.cum.push(d.cum[i - 1] + metri(d.punti[i - 1][0], d.punti[i - 1][1], d.punti[i][0], d.punti[i][1]));
  }
  // elenco: le fermate nell'ordine della prima direzione, poi quelle che ha solo l'altra
  const ordine = [];
  for (const d of p.direzioni) for (const f of d.fermate) if (!ordine.includes(f.f)) ordine.push(f.f);
  const sel = $('sel-fermata');
  for (const i of ordine) { const o = document.createElement('option'); o.value = i; o.textContent = fermate[i].nome; sel.appendChild(o); }
  sel.onchange = () => scegli(sel.value === '' ? -1 : +sel.value, false);
  const salvata = localStorage.getItem('qr_fermata_' + linea);
  const k = fermate.findIndex(f => f.nome === salvata);
  if (k >= 0) scegli(k, false);
  $('arrivo').hidden = false;
}
function scegli(i, dallaMappa) {
  scelta = i; $('sel-fermata').value = i < 0 ? '' : String(i); $('esito-vicina').textContent = '';
  segni.forEach((s, k) => s.setStyle(k === i ? { fillColor: '#DD052B', color: '#18213E', radius: 8 } : { fillColor: '#fff', color: '#18213E', radius: 6 }));
  if (i >= 0) { localStorage.setItem('qr_fermata_' + linea, fermate[i].nome); if (dallaMappa) segni[i].openTooltip(); }
  else localStorage.removeItem('qr_fermata_' + linea);
  if (bus.size) scrivi();
}
$('vicina').onclick = () => {
  if (!navigator.geolocation) { $('esito-vicina').textContent = 'Questo telefono non dà la posizione: scegli la fermata dall\'elenco.'; return; }
  $('esito-vicina').textContent = 'Cerco la fermata più vicina…';
  navigator.geolocation.getCurrentPosition(g => {
    let k = -1, dist = Infinity;
    for (const o of $('sel-fermata').options) if (o.value !== '') {
      const f = fermate[+o.value], m = metri(g.coords.latitude, g.coords.longitude, f.lat, f.lon);
      if (m < dist) { dist = m; k = +o.value; }
    }
    if (k < 0) return;
    scegli(k, true);
    $('esito-vicina').textContent = 'La fermata più vicina a te: ' + fermate[k].nome + ', a ' + (dist < 1000 ? Math.round(dist / 10) * 10 + ' m' : (dist / 1000).toFixed(1).replace('.', ',') + ' km') + '.';
  }, () => { $('esito-vicina').textContent = 'Posizione non disponibile o non concessa: scegli la fermata dall\'elenco.'; },
  { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 });
};
function proietta(d, la, lo) {
  const c = Math.cos(la * Math.PI / 180); let meglio = { m: 0, scarto: Infinity };
  for (let i = 0; i < d.punti.length - 1; i++) {
    const ax = (d.punti[i][1] - lo) * c, ay = d.punti[i][0] - la, bx = (d.punti[i + 1][1] - lo) * c, by = d.punti[i + 1][0] - la;
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
    const s = Math.hypot(ax + t * dx, ay + t * dy) * 111195;
    if (s < meglio.scarto) meglio = { m: d.cum[i] + t * (d.cum[i + 1] - d.cum[i]), scarto: s };
  }
  return meglio;
}
function giornoDi(dt) { return dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, '0') + String(dt.getDate()).padStart(2, '0'); }
function previsto(d, o, m) {           // ora d'orario (s) in cui la corsa o è al metro m del percorso d
  const mo = r => d.fermate[r[0]].m;
  if (m <= mo(o[0])) return o[0][2];
  for (let i = 0; i < o.length - 1; i++) {
    const a = mo(o[i]), b = mo(o[i + 1]);
    if (m <= b) return o[i][2] + (b > a ? (m - a) / (b - a) : 1) * (o[i + 1][1] - o[i][2]);
  }
  return o[o.length - 1][1];
}
function riconosci(id, p) {            // la corsa che il bus sta facendo, o il motivo per cui non si sa
  if (!orario) return null;
  const adesso = new Date(), ieri = new Date(adesso.getTime() - 86400000);
  const sec = adesso.getHours() * 3600 + adesso.getMinutes() * 60 + adesso.getSeconds();
  const giorni = [[giornoDi(adesso), sec], [giornoDi(ieri), sec + 86400]];          // le corse notturne vanno oltre le 24
  const proiez = orario.direzioni.map(d => proietta(d, p.latitude, p.longitude));
  // verso: si confronta con una posizione di almeno 30 s prima
  const t = new Date(p.fixTime).getTime(), tr = tracce.get(id) || [];
  if (!tr.length || tr[tr.length - 1].t !== t) { tr.push({ t, m: proiez.map(x => x.m) }); while (tr.length > 30) tr.shift(); tracce.set(id, tr); }
  const prima = [...tr].reverse().find(x => t - x.t >= 30000);
  let meglio = null, vicino = false;
  orario.direzioni.forEach((d, di) => {
    const pr = proiez[di];
    if (pr.scarto > 1500) return;                                   // il bus non è su questo percorso
    vicino = true;
    if (prima && pr.m - prima.m[di] < -300) return;                 // sta andando nel verso opposto
    for (const c of d.corse) for (const [g, s] of giorni) {
      if (!orario.giorni[c.c].has(g)) continue;
      if (s < c.o[0][2] - 1800 || s > c.o[c.o.length - 1][1] + 5400) continue;   // fuori dalla finestra della corsa
      const rit = s - previsto(d, c.o, pr.m);
      if (!meglio || Math.abs(rit) < Math.abs(meglio.rit)) meglio = { d, c, rit, m: pr.m, s };
    }
  });
  if (meglio && Math.abs(meglio.rit) <= 3 * 3600) return meglio;
  return { motivo: vicino ? 'l\'orario di oggi non prevede una corsa in questo momento' : 'il bus è fuori dal percorso della linea' };
}
function hhmm(s) { s = ((Math.round(s / 60) % 1440) + 1440) % 1440; return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function durata(s) { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
function stima(b, fermo) {             // [testo grande, testo piccolo] per la riga del bus; la fermata si legge nel menu
  if (scelta < 0 || !b.riconosciuta) return null;
  const x = b.riconosciuta;
  if (x.motivo) return ['Stima non disponibile', x.motivo];
  const k = x.d.fermate.findIndex(f => f.f === scelta), riga = k < 0 ? null : x.c.o.find(r => r[0] === k);
  if (!riga) return ['Non passa dalla tua fermata', 'questo bus va verso ' + x.d.verso];
  const mf = x.d.fermate[k].m;
  if (mf < x.m - 200) return ['Già passato dalla tua fermata', 'orario di passaggio ' + hhmm(riga[1])];
  if (Math.abs(mf - x.m) <= 200 && fermo) return ['È alla tua fermata', 'partenza prevista alle ' + hhmm(riga[2])];
  // davanti al capolinea prima della partenza si conta dall'ora di partenza; in viaggio, dal punto in cui è il bus
  const manca = x.rit < 0 && x.m <= x.d.fermate[x.c.o[0][0]].m + 300 ? riga[1] - x.s : riga[1] - previsto(x.d, x.c.o, x.m);
  const r = Math.round(x.rit / 60);
  return ['Arriva fra circa ' + durata(manca),
          'orario ' + hhmm(riga[1]) + ' · ' + (r >= 2 ? 'in ritardo di ' + r + ' min' : r <= -2 ? 'in anticipo di ' + (-r) + ' min' : 'in orario')];
}

// Punti notevoli della linea: geo aree Traccar con attributo linea=<codice>, collegate all'utente del QR
let linea = '', punti = [];
const stratoPunti = L.layerGroup().addTo(mappa);
async function leggiPunti() {
  try {
    const tutte = await api('/api/geofences');
    punti = [];
    for (const g of tutte) {
      if (((g.attributes || {}).linea || '').toLowerCase() !== linea) continue;
      const m = /CIRCLE\s*\(\s*(-?[\d.]+)\s+(-?[\d.]+)\s*,\s*([\d.]+)\s*\)/i.exec(g.area || '');
      if (m) punti.push({ nome: g.name.replace(/^.*? · /, ''), lat: +m[1], lon: +m[2], r: +m[3] });
    }
    stratoPunti.clearLayers();
    for (const q of punti) {
      L.circle([q.lat, q.lon], { radius: q.r, color: '#18213E', weight: 2, fillColor: '#18213E', fillOpacity: .12 }).addTo(stratoPunti);
      L.circleMarker([q.lat, q.lon], { radius: 5, color: '#fff', weight: 2, fillColor: '#18213E', fillOpacity: 1 })
        .bindTooltip(q.nome, { permanent: true, direction: 'right', offset: [8, 0], className: 'etichetta' }).addTo(stratoPunti);
    }
  } catch (e) { /* i punti sono un di più: senza, la mappa funziona lo stesso */ }
}
function metri(a, b, c, d) { const R = 6371000, x = (d - b) * Math.PI / 180 * Math.cos((a + c) / 2 * Math.PI / 180), y = (c - a) * Math.PI / 180; return R * Math.hypot(x, y); }
function vicinoA(p, fermo) {
  const dentro = punti.filter(q => metri(p.latitude, p.longitude, q.lat, q.lon) <= q.r);
  if (dentro.length || !fermo) return dentro.length ? dentro[0].nome : '';
  // bus fermo: la fermata GTFS entro 150 m, la più vicina (in movimento «fermata X» sembrerebbe una sosta)
  let meglio = null, dist = 150;
  for (const f of fermate) { const m = metri(p.latitude, p.longitude, f.lat, f.lon); if (m <= dist) { dist = m; meglio = f; } }
  return meglio ? 'fermata ' + meglio.nome : '';
}

async function aggiorna() {
  if (!CODICE) { vuoto('Codice non valido', 'Il collegamento è incompleto: inquadra di nuovo il codice QR.'); return; }
  try {
    const dispositivi = await api('/api/devices');
    if (!dispositivi.length) {
      vuoto('Nessun bus in condivisione', 'In questo momento la posizione di questa linea non è condivisa. Riprova più tardi.'); return;
    }
    const nuovaFirma = dispositivi.map(d => d.id).sort().join(',');
    if (nuovaFirma !== firma) { await leggiServizio(); }          // telefoni cambiati: rileggo le direzioni
    const posizioni = await api('/api/positions');
    // ordine e colore: quello delle direzioni; i telefoni senza direzione in coda
    const ordine = dispositivi.map(d => ({ d, i: direzioni.findIndex(x => +x.deviceId === d.id) }))
                              .sort((a, b) => (a.i < 0 ? 99 : a.i) - (b.i < 0 ? 99 : b.i));
    for (const id of [...bus.keys()]) if (!dispositivi.some(d => d.id === id)) { bus.get(id).segnaposto.remove(); bus.get(id).alone.remove(); bus.delete(id); }
    ordine.forEach(({ d, i }, k) => {
      const colore = COLORI[(i < 0 ? k : i) % COLORI.length];
      const nome = i >= 0 ? (direzioni[i].nome || '') : '';
      const p = posizioni.find(x => x.deviceId === d.id) || null;
      let b = bus.get(d.id);
      if (!b && p) {
        const dove = [p.latitude, p.longitude];
        b = { alone: L.circle(dove, { radius: Math.max(p.accuracy || 0, 15), color: colore, weight: 1, fillOpacity: .12 }).addTo(mappa),
              segnaposto: L.marker(dove, { icon: icona(colore), keyboard: false, title: nome || 'Il bus' }).addTo(mappa) };
        bus.set(d.id, b);
      }
      if (b) {
        Object.assign(b, { posizione: p, nome, colore });
        if (p) { b.segnaposto.setLatLng([p.latitude, p.longitude]); b.alone.setLatLng([p.latitude, p.longitude]).setRadius(Math.max(p.accuracy || 0, 15)); }
        b.segnaposto.unbindTooltip();
        if (nome && ordine.length > 1) b.segnaposto.bindTooltip(nome, { permanent: true, direction: 'top', offset: [0, -22], className: 'etichetta' });
      }
    });
    for (const [id, b] of bus) b.riconosciuta = b.posizione && Date.now() - new Date(b.posizione.fixTime) <= VECCHIA ? riconosci(id, b.posizione) : null;
    if (!bus.size) { vuoto('Posizione non ancora disponibile', 'Il telefono a bordo non ha ancora inviato la sua posizione.'); return; }
    $('vuoto').style.display = 'none'; if (orario) $('arrivo').hidden = false;
    if (nuovaFirma !== firma) { firma = nuovaFirma; costruisciScheda(ordine.map(o => o.d.id)); primo = true; seguire = 'tutti'; }
    inquadra();
    scrivi();
  } catch (e) {
    if (e.message === 'codice') vuoto('Codice non più valido', 'Questo codice QR non è più attivo. Rivolgiti al personale Busitalia.');
    else { const a = $('scheda').querySelector('.avviso'); if (a) a.textContent = 'Connessione assente: riprovo fra pochi secondi.'; }
  }
}
function inquadra() {
  const tutti = [...bus.values()].filter(b => b.posizione).map(b => [b.posizione.latitude, b.posizione.longitude]);
  if (!tutti.length) return;
  if (seguire === 'tutti') {
    if (tutti.length === 1) { if (primo) mappa.setView(tutti[0], 15); else mappa.panTo(tutti[0], { animate: true }); }
    else mappa.fitBounds(L.latLngBounds(tutti), { padding: [64, 64], maxZoom: 13, animate: !primo });
  } else if (seguire != null && bus.get(seguire) && bus.get(seguire).posizione) {
    const p = bus.get(seguire).posizione; mappa.panTo([p.latitude, p.longitude], { animate: true });
  }
  primo = false;
}
function costruisciScheda(ids) {
  const multi = ids.length > 1;
  $('scheda').className = multi ? 'multi' : '';
  $('scheda').innerHTML = '';
  for (const id of ids) {
    const r = document.createElement('div'); r.className = 'riga'; r.dataset.id = id;
    r.innerHTML = '<div><p class="dir"><i></i><span></span></p><p class="stato"></p><p class="dettaglio"></p><p class="avviso"></p><p class="eta"></p></div><button type="button">Centra</button>';
    r.querySelector('button').onclick = () => {
      const b = bus.get(id); if (!b || !b.posizione) return;
      seguire = multi ? id : 'tutti'; mappa.setView([b.posizione.latitude, b.posizione.longitude], Math.max(mappa.getZoom(), 14));
    };
    $('scheda').appendChild(r);
  }
}
function scrivi() {
  let tutteVecchie = true;
  for (const r of $('scheda').querySelectorAll('.riga[data-id]')) {
    const b = bus.get(+r.dataset.id), multi = bus.size > 1;
    const dir = r.querySelector('.dir');
    dir.style.display = multi && b && b.nome ? '' : 'none';
    if (b) { dir.querySelector('i').style.background = b.colore; dir.querySelector('span').textContent = b.nome; }
    const p = b && b.posizione;
    if (!p) { r.querySelector('.stato').textContent = 'Posizione non ancora disponibile'; r.querySelector('.dettaglio').textContent = ''; continue; }
    const quando = new Date(p.fixTime), eta = Date.now() - quando.getTime();
    const kmh = Math.round((p.speed || 0) * 1.852);       // Traccar dà la velocità in nodi
    const vecchia = eta > VECCHIA; if (!vecchia) tutteVecchie = false;
    const qui = vicinoA(p, kmh < 5);
    r.querySelector('.stato').textContent = (vecchia ? 'Ultima posizione nota' : (kmh >= 5 ? 'In viaggio · ' + kmh + ' km/h' : 'Fermo')) + (qui ? ' · ' + qui : '');
    r.querySelector('.dettaglio').textContent = 'Aggiornata alle ' + ora(quando) + ' · ' + quanto(eta);
    r.classList.toggle('ferma', vecchia);
    const e = vecchia ? null : stima(b, kmh < 5), el = r.querySelector('.eta');
    el.textContent = ''; if (e) { el.append(e[0]); const sm = document.createElement('small'); sm.textContent = e[1]; el.append(sm); }
    r.querySelector('.avviso').textContent = vecchia ? 'Il telefono a bordo non invia la posizione da ' + quanto(eta).replace(' fa', '') + ': il bus potrebbe essere altrove.' : '';
  }
  if (bus.size) $('scheda').classList.toggle('ferma', tutteVecchie);
}

leggiServizio(); aggiorna();
setInterval(aggiorna, OGNI);
setInterval(leggiServizio, 60000);
setInterval(() => { if (bus.size) scrivi(); }, 1000);   // «12 secondi fa» che scorre fra un aggiornamento e l'altro
</script>
</body>
